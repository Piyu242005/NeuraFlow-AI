name: NeuraFlow Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Tests
        run: pytest -q

      - name: Formatting check
        run: black --check .

      - name: Import ordering check
        run: isort --check-only .

      - name: Lint
        run: flake8 .

      - name: Security scan
        run: bandit -r services providers evaluation -ll
